name = "Roop"
grammar = "roop"
path_suffixes = ["roop"]
line_comments = ["// "]
tab_size = 4
brackets = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "(", end = ")", close = true, newline = false },
  { start = "[", end = "]", close = true, newline = false },
]

# Once there is a language server, name it here as in extension.toml:
# language_servers = ["roop-lsp"]
